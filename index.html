<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourier Transform Visualizer Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Toolbar -->
    <div class="toolbar">
        <div class="toolbar-section">
            <div class="toolbar-group">
                <label class="toolbar-label">File</label>
                <button class="toolbar-btn" id="importSvgBtn" title="Import SVG file">
                    <span class="icon">📁</span> Import SVG
                </button>
                <button class="toolbar-btn" id="importImageBtn" title="Import image">
                    <span class="icon">🖼️</span> Import Image
                </button>
                <button class="toolbar-btn" id="saveProjectBtn" title="Save project">
                    <span class="icon">💾</span> Save
                </button>
                <button class="toolbar-btn" id="loadProjectBtn" title="Load project">
                    <span class="icon">📂</span> Load
                </button>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-label">Export</label>
                <button class="toolbar-btn" id="exportGifBtn" title="Export as GIF">
                    <span class="icon">🎬</span> GIF
                </button>
                <button class="toolbar-btn" id="exportJsonBtn" title="Export as JSON">
                    <span class="icon">📄</span> JSON
                </button>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-label">Share</label>
                <button class="toolbar-btn" id="shareUrlBtn" title="Share via URL">
                    <span class="icon">🔗</span> Share URL
                </button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-btn" id="galleryBtn" title="Example gallery">
                    <span class="icon">🎨</span> Gallery
                </button>
                <button class="toolbar-btn" id="tutorialBtn" title="Start tutorial">
                    <span class="icon">🎓</span> Tutorial
                </button>
                <button class="toolbar-btn" id="shortcutsBtn" title="Keyboard shortcuts">
                    <span class="icon">⌨️</span> Shortcuts
                </button>
            </div>
        </div>
        <div class="toolbar-section">
            <button class="toolbar-btn" id="themeToggle">
                <span class="icon">🌓</span> Theme
            </button>
            <button class="toolbar-btn" id="fullscreenBtn">
                <span class="icon">⛶</span>
            </button>
        </div>
    </div>

    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar left-sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="input">Input</button>
                <button class="tab-btn" data-tab="appearance">Appearance</button>
                <button class="tab-btn" data-tab="controls">Controls</button>
                <button class="tab-btn" data-tab="advanced">Advanced</button>
            </div>

            <!-- Input Tab -->
            <div class="tab-content active" data-tab="input">
                <div class="control-section">
                    <h3>Presets</h3>
                    <div class="button-grid">
                        <button class="preset-btn" data-preset="circle">Circle</button>
                        <button class="preset-btn" data-preset="square">Square</button>
                        <button class="preset-btn" data-preset="triangle">Triangle</button>
                        <button class="preset-btn" data-preset="star">Star</button>
                        <button class="preset-btn" data-preset="heart">Heart</button>
                        <button class="preset-btn" data-preset="spiral">Spiral</button>
                        <button class="preset-btn" data-preset="lissajous">Lissajous</button>
                        <button class="preset-btn" data-preset="rose">Rose</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Draw Custom</h3>
                    <button id="drawModeBtn" class="control-btn">Enable Drawing</button>
                    <button id="clearDrawingBtn" class="control-btn secondary">Clear</button>
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="closePathCheck"> Close path
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Parametric Equation</h3>
                    <div class="input-group">
                        <label>X(t) =</label>
                        <input type="text" id="paramX" placeholder="cos(t)" class="param-input">
                    </div>
                    <div class="input-group">
                        <label>Y(t) =</label>
                        <input type="text" id="paramY" placeholder="sin(t)" class="param-input">
                    </div>
                    <div class="input-group">
                        <label>Points:</label>
                        <input type="number" id="paramPoints" value="100" min="10" max="500" class="param-input">
                    </div>
                    <button id="applyParamBtn" class="control-btn primary">Apply</button>
                </div>
            </div>

            <!-- Appearance Tab -->
            <div class="tab-content" data-tab="appearance">
                <div class="control-section">
                    <h3>Colors</h3>
                    <div class="color-picker-group">
                        <label>Background:</label>
                        <input type="color" id="bgColor" value="#151935">
                    </div>
                    <div class="color-picker-group">
                        <label>Circles:</label>
                        <input type="color" id="circleColor" value="#ffffff">
                        <input type="range" id="circleOpacity" min="0" max="100" value="30" class="opacity-slider">
                    </div>
                    <div class="color-picker-group">
                        <label>Vectors:</label>
                        <input type="color" id="vectorColor" value="#3b82f6">
                    </div>
                    <div class="color-picker-group">
                        <label>Path:</label>
                        <input type="color" id="pathColor" value="#3b82f6">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Effects</h3>
                    <label class="toggle">
                        <input type="checkbox" id="rainbowMode">
                        <span>Rainbow Trail</span>
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="glowEffect">
                        <span>Glow Effect</span>
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="particleEffect">
                        <span>Particle Trail</span>
                    </label>
                    <div class="control-group">
                        <label>Trail Width: <span id="trailWidthValue">3</span>px</label>
                        <input type="range" id="trailWidth" min="1" max="10" value="3">
                    </div>
                </div>
            </div>

            <!-- Controls Tab -->
            <div class="tab-content" data-tab="controls">
                <div class="control-section">
                    <h3>Visualization</h3>
                    <div class="control-group">
                        <label>Epicycles: <span id="vectorCount">50</span></label>
                        <input type="range" id="vectorSlider" min="1" max="200" value="50" step="1">
                    </div>

                    <div class="control-group">
                        <label>Speed: <span id="speedValue">1.0x</span></label>
                        <input type="range" id="speedSlider" min="0.1" max="5" value="1" step="0.1">
                    </div>

                    <div class="control-group">
                        <label>Trail Length: <span id="trailValue">100%</span></label>
                        <input type="range" id="trailSlider" min="10" max="100" value="100" step="5">
                    </div>

                    <div class="toggle-group">
                        <label class="toggle">
                            <input type="checkbox" id="showCircles" checked>
                            <span>Show Circles</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" id="showVectors" checked>
                            <span>Show Vectors</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" id="showPath" checked>
                            <span>Show Path</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Advanced Tab -->
            <div class="tab-content" data-tab="advanced">
                <div class="control-section">
                    <h3>Path Editor</h3>
                    <button id="editModeBtn" class="control-btn">Enable Edit Mode</button>
                    <button id="undoBtn" class="control-btn secondary">Undo</button>
                    <button id="redoBtn" class="control-btn secondary">Redo</button>
                </div>

                <div class="control-section">
                    <h3>Playback</h3>
                    <label class="toggle">
                        <input type="checkbox" id="stepMode">
                        <span>Step-by-Step Mode</span>
                    </label>
                    <button id="stepForwardBtn" class="control-btn">Step Forward</button>
                </div>

                <div class="control-section">
                    <h3>Performance</h3>
                    <label class="toggle">
                        <input type="checkbox" id="performanceMode">
                        <span>Performance Mode</span>
                    </label>
                    <div class="control-group">
                        <label>Target FPS: <span id="targetFpsValue">60</span></label>
                        <input type="range" id="targetFps" min="30" max="120" value="60" step="10">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Multiple Paths</h3>
                    <button id="addPathBtn" class="control-btn primary">Add Path</button>
                    <div id="pathsList" class="paths-list"></div>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area">
            <canvas id="canvas"></canvas>
            <div id="fpsCounter">FPS: 60</div>
            <div id="recordingIndicator" class="hidden">🔴 Recording...</div>
        </div>

        <!-- Right Panel -->
        <div class="sidebar right-sidebar" id="rightPanel">
            <button class="panel-toggle" id="rightPanelToggle">◀</button>

            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="spectrum">Spectrum</button>
                <button class="tab-btn" data-tab="math">Math</button>
                <button class="tab-btn" data-tab="audio">Audio</button>
            </div>

            <div class="tab-content active" data-tab="spectrum">
                <h3>Frequency Spectrum</h3>
                <canvas id="spectrumCanvas" width="300" height="400"></canvas>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="showSpectrumLabels" checked>
                        Show Labels
                    </label>
                </div>
            </div>

            <div class="tab-content" data-tab="math">
                <h3>Fourier Coefficients</h3>
                <div id="mathPanel" class="math-panel"></div>
                <button id="exportCoeffBtn" class="control-btn secondary">Export Coefficients</button>
            </div>

            <div class="tab-content" data-tab="audio">
                <h3>Audio Visualization</h3>
                <button id="audioToggleBtn" class="control-btn primary">Enable Microphone</button>
                <canvas id="audioCanvas" width="300" height="200"></canvas>
                <div class="control-group">
                    <label>Sensitivity: <span id="audioSensitivity">50</span></label>
                    <input type="range" id="audioSensSlider" min="1" max="100" value="50">
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline -->
    <div class="timeline">
        <div class="timeline-controls">
            <button class="timeline-btn" id="playPauseBtn" title="Play/Pause (Space)">▶</button>
            <button class="timeline-btn" id="reverseBtn" title="Reverse">⏪</button>
            <button class="timeline-btn" id="resetBtn" title="Reset">⏹</button>
            <select id="loopMode" class="loop-select" title="Loop mode">
                <option value="repeat">Repeat</option>
                <option value="once">Once</option>
                <option value="pingpong">Ping-Pong</option>
            </select>
        </div>
        <div class="timeline-scrubber">
            <input type="range" id="timeSlider" min="0" max="1000" value="0" step="1">
            <div class="time-display">
                <span id="currentTime">0.0s</span> / <span id="totalTime">10.0s</span>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="galleryModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Example Gallery</h2>
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <div id="tutorialModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="tutorialContent"></div>
            <div class="tutorial-nav">
                <button id="tutorialPrev" class="control-btn secondary">Previous</button>
                <span id="tutorialProgress"></span>
                <button id="tutorialNext" class="control-btn primary">Next</button>
            </div>
        </div>
    </div>

    <div id="shortcutsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Keyboard Shortcuts</h2>
            <div id="shortcutsList" class="shortcuts-list"></div>
        </div>
    </div>

    <div id="exportModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Export GIF</h2>
            <div class="export-settings">
                <div class="control-group">
                    <label>Duration (seconds):</label>
                    <input type="number" id="gifDuration" value="5" min="1" max="30">
                </div>
                <div class="control-group">
                    <label>Frame Rate:</label>
                    <input type="number" id="gifFrameRate" value="30" min="10" max="60">
                </div>
                <div class="control-group">
                    <label>Quality:</label>
                    <select id="gifQuality">
                        <option value="10">High</option>
                        <option value="20" selected>Medium</option>
                        <option value="30">Low</option>
                    </select>
                </div>
                <div id="exportProgress" class="hidden">
                    <progress id="exportProgressBar" max="100" value="0"></progress>
                    <span id="exportProgressText">0%</span>
                </div>
                <button id="startExportBtn" class="control-btn primary">Start Export</button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="svgFileInput" accept=".svg" style="display: none;">
    <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
    <input type="file" id="projectFileInput" accept=".json" style="display: none;">

    <!-- Scripts -->
    <script src="js/complex.js"></script>
    <script src="js/fourier.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/pathEditor.js"></script>
    <script src="js/parametric.js"></script>
    <script src="js/fileHandlers.js"></script>
    <script src="js/exportGif.js"></script>
    <script src="js/urlShare.js"></script>
    <script src="js/spectrum.js"></script>
    <script src="js/audioVisualizer.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/undoRedo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
